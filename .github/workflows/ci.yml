name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  ci:
    name: Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/derryman101/agrocd-demo:${{ github.sha }} \
            .

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push ghcr.io/derryman101/agrocd-demo:${{ github.sha }}

      - name: Update GitOps repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          git clone https://x-access-token:${GITOPS_TOKEN}@github.com/derryman101/agrocd-demo-gitops.git gitops

          cd gitops

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path("apps/agrocd-demo/deployment.yaml")
          text = path.read_text()

          image = f"ghcr.io/derryman101/agrocd-demo:{os.environ['IMAGE_TAG']}"

          text = re.sub(
              r'(\s+image:\s*)\S+',
              rf'\1{image}',
              text,
              count=1
          )

          if "name: GIT_SHA" in text:
              text = re.sub(
                  r'(\s+- name: GIT_SHA\s+value:\s*)\S+',
                  rf'\1{os.environ["IMAGE_TAG"]}',
                  text,
                  count=1
              )
          else:
              text = re.sub(
                  r'(\s+imagePullPolicy:.*\n)',
                  rf'\1          env:\n            - name: GIT_SHA\n              value: "{os.environ["IMAGE_TAG"]}"\n',
                  text,
                  count=1
              )

          path.write_text(text)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add apps/agrocd-demo/deployment.yaml

          git diff --cached --quiet || \
            git commit -m "chore: update agrocd-demo image to ${IMAGE_TAG}"

          git push origin main
