name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  ci:
    name: Test and Build
    runs-on: ubuntu-latest

    steps:
      # ----------------------------------------
      # Checkout application
      # ----------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------
      # Node.js
      # ----------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # ----------------------------------------
      # Install dependencies
      # ----------------------------------------
      - name: Install dependencies
        run: npm ci

      # ----------------------------------------
      # Tests
      # ----------------------------------------
      - name: Run tests
        run: npm test

      # ----------------------------------------
      # Docker build
      # ----------------------------------------
      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/derryman101/agrocd-demo:${{ github.sha }} \
            .

      # ----------------------------------------
      # GHCR login
      # ----------------------------------------
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ----------------------------------------
      # Push image to GHCR
      # ----------------------------------------
      - name: Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push ghcr.io/derryman101/agrocd-demo:${{ github.sha }}

      # ----------------------------------------
      # Update GitOps repository
      # ----------------------------------------
      - name: Update GitOps repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # ----------------------------------------
          # Clone GitOps repository
          # ----------------------------------------

          git clone \
            https://x-access-token:${GITOPS_TOKEN}@github.com/derryman101/agrocd-demo-gitops.git \
            gitops

          cd gitops

          # ----------------------------------------
          # Update Kubernetes Deployment
          # ----------------------------------------

          python3 - <<'PY'
          from pathlib import Path
          import os

          path = Path("apps/agrocd-demo/deployment.yaml")

          if not path.exists():
              raise SystemExit(
                  "ERROR: apps/agrocd-demo/deployment.yaml not found"
              )

          lines = path.read_text().splitlines()

          sha = os.environ["IMAGE_TAG"]
          image = f"ghcr.io/derryman101/agrocd-demo:{sha}"

          # ----------------------------------------
          # Find container image
          # ----------------------------------------

          image_index = None

          for i, line in enumerate(lines):
              if line.strip().startswith("image:"):
                  image_index = i
                  break

          if image_index is None:
              raise SystemExit(
                  "ERROR: container image field not found"
              )

          image_indent = len(lines[image_index]) - len(
              lines[image_index].lstrip()
          )

          lines[image_index] = (
              " " * image_indent + f"image: {image}"
          )

          # ----------------------------------------
          # Find imagePullPolicy
          # ----------------------------------------

          image_pull_policy_index = None

          for i in range(image_index + 1, len(lines)):
              if lines[i].strip().startswith("imagePullPolicy:"):
                  image_pull_policy_index = i
                  break

              # Stop if we leave the container.
              current_indent = len(lines[i]) - len(lines[i].lstrip())

              if (
                  lines[i].strip()
                  and current_indent < image_indent
              ):
                  break

          if image_pull_policy_index is None:
              raise SystemExit(
                  "ERROR: imagePullPolicy field not found"
              )

          env_indent = len(lines[image_pull_policy_index]) - len(
              lines[image_pull_policy_index].lstrip()
          )

          # ----------------------------------------
          # Find existing env block
          # ----------------------------------------

          env_index = None

          for i in range(image_pull_policy_index + 1, len(lines)):
              stripped = lines[i].strip()
              current_indent = len(lines[i]) - len(lines[i].lstrip())

              if (
                  stripped == "env:"
                  and current_indent == env_indent
              ):
                  env_index = i
                  break

              # A field at the same container level means
              # there is no env block before it.
              if (
                  stripped
                  and current_indent == env_indent
                  and stripped != "env:"
              ):
                  break

              # We left the container.
              if (
                  stripped
                  and current_indent < env_indent
              ):
                  break

          # ----------------------------------------
          # Remove existing env block(s)
          # ----------------------------------------

          if env_index is not None:
              env_end = env_index + 1

              while env_end < len(lines):
                  line = lines[env_end]

                  if not line.strip():
                      env_end += 1
                      continue

                  current_indent = len(line) - len(line.lstrip())

                  # A field at container indentation ends env.
                  if current_indent <= env_indent:
                      break

                  env_end += 1

              del lines[env_index:env_end]

              # imagePullPolicy index moved after deletion.
              image_pull_policy_index = env_index - 1

              while (
                  image_pull_policy_index >= 0
                  and not lines[image_pull_policy_index]
                  .strip()
                  .startswith("imagePullPolicy:")
              ):
                  image_pull_policy_index -= 1

          # ----------------------------------------
          # Add exactly one env block
          # ----------------------------------------

          indent = " " * env_indent

          env_lines = [
              f"{indent}env:",
              f"{indent}  - name: APP_ENV",
              f'{indent}    value: "Kubernetes"',
              f"{indent}  - name: GIT_SHA",
              f'{indent}    value: "{sha}"',
          ]

          lines[
              image_pull_policy_index + 1:
              image_pull_policy_index + 1
          ] = env_lines

          # ----------------------------------------
          # Write Deployment
          # ----------------------------------------

          path.write_text(
              "\n".join(lines) + "\n"
          )
          PY

          # ----------------------------------------
          # Show generated manifest
          # ----------------------------------------

          echo "========================================"
          echo "Generated Kubernetes Deployment:"
          echo "========================================"

          sed -n '1,160p' apps/agrocd-demo/deployment.yaml

          echo "========================================"
          echo "Git diff:"
          echo "========================================"

          git diff -- apps/agrocd-demo/deployment.yaml

          # ----------------------------------------
          # Git identity
          # ----------------------------------------

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # ----------------------------------------
          # Commit GitOps change
          # ----------------------------------------

          git add apps/agrocd-demo/deployment.yaml

          if git diff --cached --quiet; then
            echo "No GitOps changes detected."
          else
            git commit \
              -m "chore: update agrocd-demo image to ${IMAGE_TAG}"

            git push origin main
          fi
